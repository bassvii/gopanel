name: CI

on:
  push:
    branches: [main]
  pull_request:

# Минимальные разрешения для GITHUB_TOKEN. По умолчанию GitHub
# выдаёт write на push в main — это лишнее для сборки и тестов.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: test
        run: go test -race ./...


      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high

  dco:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          fail=0
          for c in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Коммит $c без Signed-off-by"
              fail=1
            fi
          done
          exit $fail

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend
        run: go build -o bin/gopanel ./cmd/gopanel

      - name: Install Xray
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          source deploy/versions.env
          url="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          curl -fsSL -o /tmp/xray.zip "$url"
          echo "${XRAY_SHA256_AMD64}  /tmp/xray.zip" | sha256sum -c -
          unzip -o /tmp/xray.zip -d /tmp/xray
          sudo mv /tmp/xray/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Prepare test DB
        env:
          GOPANEL_ADMIN_PASSWORD: "verylongpassword123"
        run: |
          rm -f /tmp/gp.db
          ./bin/gopanel admin create --db /tmp/gp.db --user admin

      - name: Start panel
        id: panel
        run: |
          ./bin/gopanel run --db /tmp/gp.db > /tmp/gopanel.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "admin listener started" /tmp/gopanel.log; then break; fi
            sleep 1
          done
          cat /tmp/gopanel.log
          LINE=$(grep "admin listener started" /tmp/gopanel.log | head -1)
          PORT=$(echo "$LINE" | grep -oP 'addr=127.0.0.1:\K\d+')
          # base_path читаем из файла рядом с БД (см. пункт 7 аудита).
          BASE=$(cat /tmp/base_path 2>/dev/null || true)
          if [ -z "$PORT" ] || [ -z "$BASE" ]; then
            echo "Failed to parse port/base_path: PORT='$PORT' BASE='$BASE'"
            exit 1
          fi
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "base_path=$BASE" >> $GITHUB_OUTPUT
          echo "PORT=$PORT BASE=$BASE"

      - name: Run e2e tests
        working-directory: web
        env:
          E2E_PORT: ${{ steps.panel.outputs.port }}
          E2E_BASE_PATH: ${{ steps.panel.outputs.base_path }}
        run: npm run test:e2e
