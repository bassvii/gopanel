name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: test
        run: go test ./...

  dco:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          fail=0
          for c in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Коммит $c без Signed-off-by"
              fail=1
            fi
          done
          exit $fail

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend
        run: go build -o bin/gopanel ./cmd/gopanel

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Prepare test DB
        run: |
          rm -f /tmp/gp.db
          ./bin/gopanel admin create --db /tmp/gp.db --user admin --password "verylongpassword123"

      - name: Start panel
        id: panel
        run: |
          ./bin/gopanel run --db /tmp/gp.db > /tmp/gopanel.log 2>&1 &
          sleep 5
          cat /tmp/gopanel.log
          LINE=$(grep "admin listener started" /tmp/gopanel.log | head -1)
          PORT=$(echo "$LINE" | grep -oP 'addr=127.0.0.1:\K\d+')
          BASE=$(echo "$LINE" | grep -oP 'base_path=\K/\S+')
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "base_path=$BASE" >> $GITHUB_OUTPUT
          echo "PORT=$PORT BASE=$BASE"

      - name: Run e2e tests
        working-directory: web
        env:
          E2E_PORT: ${{ steps.panel.outputs.port }}
          E2E_BASE_PATH: ${{ steps.panel.outputs.base_path }}
        run: npm run test:e2e
