services:
  gopanel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: gopanel:latest
    container_name: gopanel
    restart: unless-stopped
    ports:
      # Проброс только на localhost хоста.
      - "127.0.0.1:44559:44559"
      # Для Hysteria2 (UDP):
      # - "443:443/udp"
      # - "8443:8443/udp"
      # Для других инбаундов (TCP):
      # - "443:443/tcp"
      environment:
        - GOPANEL_LISTEN=0.0.0.0
        - GOPANEL_PORT=44559
        - GOPANEL_ALLOW_NON_LOOPBACK=1
        - GOPANEL_DB_PATH=/var/lib/gopanel/gopanel.db
    volumes:
      - gopanel-data:/var/lib/gopanel
    # Xray внутри контейнера слушает 0.0.0.0 и порты инбаундов.
    # Чтобы клиенты могли подключаться, пробрасываем порты инбаундов.
    # Например, для VLESS на 443:
    # - "443:443"

volumes:
  gopanel-data:
